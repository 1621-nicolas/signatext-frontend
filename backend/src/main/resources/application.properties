spring.application.name=signatext-backend
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=signatext_db;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://*:4200,https://*:4200}

jwt.secret=${JWT_SECRET:signatext-dev-secret-key-change-this-before-production-2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

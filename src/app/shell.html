<header class="topbar">
  <a class="brand" routerLink="/inicio" aria-label="Ir al inicio de SignaText">
    <span class="brand-mark">S</span>
    <span>SignaText</span>
  </a>

  <nav class="main-nav" aria-label="Navegación principal">
    <a routerLink="/inicio" routerLinkActive="active">Inicio</a>
    <a routerLink="/traductor" routerLinkActive="active">Traductor</a>
    <a routerLink="/sala" routerLinkActive="active">Sala privada</a>
    <a routerLink="/llamada" routerLinkActive="active">Videollamada</a>
    <a routerLink="/dataset" routerLinkActive="active">Dataset</a>
  </nav>

  <div class="auth-nav">
    @if (authService.usuario()) {
      <span class="user-name">
        {{ authService.usuario()?.nombre }}
      </span>
      <button type="button" class="logout-button" (click)="cerrarSesion()">
        Cerrar sesión
      </button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Iniciar sesión</a>
      <a class="register-link" routerLink="/registro">Crear cuenta</a>
    }
  </div>
</header>

<router-outlet></router-outlet>
